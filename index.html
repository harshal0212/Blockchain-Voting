<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChainVote — Decentralized voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">◇</div>
            <div>
                <div class="brand-text">ChainVote</div>
            </div>
        </div>
        <span class="badge-live">On-chain</span>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1><span class="gradient-accent">Transparent</span> voting, anchored on the blockchain</h1>
            <p class="hero-lead">Connect your wallet, complete verification, and cast your vote. Results update live from the contract.</p>
        </section>

        <div class="panel-grid">
            <section class="panel" aria-labelledby="wallet-heading">
                <div class="panel-label" id="wallet-heading">Wallet</div>
                <div class="wallet-row">
                    <button type="button" class="btn-primary-custom btn-connect" onclick="connectWallet()">Connect wallet</button>
                </div>
                <p id="walletAddress" aria-live="polite"></p>
            </section>

            <section class="panel" aria-labelledby="verify-heading">
                <div class="panel-label" id="verify-heading">Verification</div>
                <div class="verify-row">
                    <div class="input-wrap">
                        <label for="voterId" class="visually-hidden">Voter ID</label>
                        <input type="text" id="voterId" placeholder="Enter your voter ID" autocomplete="off">
                    </div>
                    <button type="button" class="btn-primary-custom btn-verify" onclick="verifyUser()">Verify identity</button>
                </div>
            </section>
        </div>

        <section class="candidates-section" aria-labelledby="candidates-heading">
            <div class="section-head">
                <h2 id="candidates-heading">Candidates</h2>
                <span class="section-hint">Refreshes every few seconds while connected</span>
            </div>
            <div id="candidates" class="row g-4"></div>
        </section>

        <section class="chart-section" aria-labelledby="chart-heading">
            <div class="section-head">
                <h2 id="chart-heading">Vote distribution</h2>
            </div>
            <div class="chart-wrap">
                <canvas id="chart" aria-label="Bar chart of votes per candidate"></canvas>
            </div>
        </section>

        <div id="status" class="status-bar" role="status" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <script src="contract-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
